<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-body shadow-sm">
        <div class="container-fluid px-4">
            
            <div class="collapse navbar-collapse" id="navbarNav" style="flex: 1;">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/products}">Trang chủ</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/products/add}">Thêm Sản Phẩm</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/categories}">Quản lý Danh Mục</a>
                    </li>
                </ul>
            </div>

            <!--isLoginPage hiển thị khi KHÔNG PHẢI là trang đăng nhập"-->
            <form th:if="${isLoginPage == null}" class="d-flex justify-content-center" role="search" th:action="@{/products}" method="get" style="flex: 1; max-width: 400px;">
                <input class="form-control me-2" type="search" placeholder="Tìm tên sản phẩm..." 
                       aria-label="Search" name="keyword" th:value="${keyword}">
                <button class="btn btn-outline-success" type="submit">Tìm</button>
            </form>

            <div class="d-flex align-items-center justify-content-end" style="flex: 1;">
                
                <div sec:authorize="!isAuthenticated()" th:if="${isLoginPage == null}"> <!--Chỉ hiển thị khi KHÔNG PHẢI là trang đăng nhập"-->
                    <a class="btn btn-primary btn-sm" th:href="@{/login}">Đăng nhập</a>
                </div>
                
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center text-white">
                    <span class="me-3">Xin chào, <strong sec:authentication="name" class="text-warning"></strong>!</span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-danger btn-sm">Đăng xuất</button>
                    </form>
                </div>
            </div>

        </div>
    </nav>

    <div layout:fragment="content" class="container body-content mt-4 bg-white p-4 rounded shadow-sm">
    </div>

    <div class="card-footer text-center mt-auto py-3 bg-dark text-white">
        <p class="mb-0">&copy; 2026 Phát triển ứng dụng với J2EE</p>
    </div>
    
</body>
</html>

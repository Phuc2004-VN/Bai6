<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{_layout}">
<head>
    <meta charset="UTF-8">
    <title>Thêm Danh Mục</title>
</head>
<body>
    <div layout:fragment="content" class="container body-content">
        <h2 class="mb-4">Thêm danh mục mới</h2>
        
        <form th:action="@{/categories/save}" th:object="${category}" method="post">
            <div class="mb-3">
                <label for="name" class="form-label">Tên danh mục:</label>
                <input class="form-control" type="text" th:field="*{name}" id="name" placeholder="Nhập tên danh mục">
                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            
            <button type="submit" class="btn btn-success">Lưu danh mục</button>
            <a href="/categories" class="btn btn-secondary">Quay lại</a>
        </form>
    </div>
</body>
</html>

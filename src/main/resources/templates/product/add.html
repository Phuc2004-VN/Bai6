<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{_layout}">
<head>
    <meta charset="UTF-8">
    <title>Thêm Sản Phẩm</title>
</head>
<body>
    <div layout:fragment="content" class="container body-content">
        <h2 class="mb-4">Thêm sản phẩm mới</h2>
        
        <form th:action="@{/products/save}" th:object="${product}" method="post" class="needs-validation">
            <div class="mb-3">
                <label for="name" class="form-label">Tên sản phẩm:</label>
                <input class="form-control" type="text" th:field="*{name}" id="name" placeholder="Nhập tên sản phẩm">
                <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            
            <div class="mb-3">
                <label for="image" class="form-label">Đường dẫn ảnh (URL):</label>
                <input class="form-control" type="text" th:field="*{image}" id="image" placeholder="Ví dụ: http://.../anh.png">
                <div class="text-danger" th:if="${#fields.hasErrors('image')}" th:errors="*{image}"></div>
            </div>
            
            <div class="mb-3">
                <label for="price" class="form-label">Giá (VNĐ):</label>
                <input class="form-control" type="number" th:field="*{price}" id="price" placeholder="Nhập giá tiền">
                <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>
            
            <div class="mb-3">
                <label for="category" class="form-label">Danh mục:</label>
                <select th:field="*{category}" class="form-control" id="category">
                    <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-success">Lưu sản phẩm</button>
            <a href="/products" class="btn btn-secondary">Quay lại</a>
        </form>
    </div>
</body>
</html>
